name: Upscale images
# Runs when tools/upscale/jobs.txt (or this file / the script) changes on a
# claude/* branch: downloads each listed image, upscales it with Real-ESRGAN
# x4plus on CPU and commits the originals and results back to the branch.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'tools/upscale/jobs.txt'
      - 'tools/upscale/upscale.py'
      - '.github/workflows/upscale.yml'
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install spandrel pillow numpy
      - name: Fetch model
        run: curl -fsSL -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
      - name: Upscale
        run: python tools/upscale/upscale.py RealESRGAN_x4plus.pth
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898296+github-actions[bot]@users.noreply.github.com'
          git add tools/upscale/orig tools/upscale/out
          git commit -m 'Upscale images (Real-ESRGAN x4plus)' || exit 0
          git push
