name: Fetch images
# Downloads every URL in tools/fetch/urls.txt into tools/fetch/out/ and
# commits them back, so a session without CDN access can look at them.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'tools/fetch/urls.txt'
      - '.github/workflows/fetch.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p tools/fetch/out
          grep -v '^#' tools/fetch/urls.txt | while read -r url name; do
            [ -n "$url" ] && curl -fsSL -o "tools/fetch/out/$name" "$url"
          done
          ls -la tools/fetch/out
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898296+github-actions[bot]@users.noreply.github.com'
          git add tools/fetch/out
          git commit -m 'Fetch images' || exit 0
          git push
